<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mat, will you be my girlfriend?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(135deg, #ffdde1 0%, #ffc3d0 40%, #ffe6f0 100%);
    overflow: hidden;
    position: relative;
  }

  /* Floating hearts background */
  .heart {
    position: absolute;
    color: #ff6b9d;
    opacity: 0.5;
    animation: float 6s ease-in-out infinite;
    user-select: none;
    pointer-events: none;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-25px) rotate(5deg); }
  }

  .card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(6px);
    padding: 3rem 2.5rem;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(255, 107, 157, 0.35);
    text-align: center;
    max-width: 500px;
    border: 3px solid #ffb6c9;
    animation: pop 0.8s ease;
  }
  @keyframes pop {
    0%   { transform: scale(0.7); opacity: 0; }
    70%  { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    font-size: 2rem;
    color: #d6336c;
    margin-bottom: 0.5rem;
    line-height: 1.3;
  }

  .emoji {
    font-size: 3.5rem;
    display: block;
    margin: 0.8rem 0;
    animation: beat 1.2s infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    30%      { transform: scale(1.2); }
    60%      { transform: scale(0.95); }
  }

  .subtitle {
    color: #a64d79;
    font-size: 1.05rem;
    margin-bottom: 2rem;
  }

  .buttons {
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    min-height: 70px;
  }

  button {
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: bold;
    padding: 0.9rem 2rem;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s, background 0.3s;
  }

  .yes {
    background: linear-gradient(135deg, #ff6b9d, #ff4081);
    color: #fff;
    box-shadow: 0 6px 15px rgba(255, 64, 129, 0.4);
  }
  .yes:hover { transform: scale(1.1); }

  .no {
    background: #f2d6de;
    color: #a64d79;
    position: relative;
    transition: transform 0.25s ease;
  }

  /* Celebration message */
  .success {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .success h2 {
    color: #d6336c;
    font-size: 1.8rem;
  }
  .success p {
    color: #a64d79;
    font-size: 1.1rem;
  }
</style>
</head>
<body>

  <!-- Floating hearts -->
  <span class="heart" style="top:10%; left:8%;  font-size:2.5rem; animation-delay:0s;">💖</span>
  <span class="heart" style="top:20%; right:10%; font-size:3rem;   animation-delay:1s;">💕</span>
  <span class="heart" style="bottom:15%; left:15%; font-size:2rem; animation-delay:2s;">💗</span>
  <span class="heart" style="bottom:25%; right:8%; font-size:2.8rem; animation-delay:1.5s;">🌸</span>
  <span class="heart" style="top:60%; left:5%;  font-size:1.8rem; animation-delay:3s;">✨</span>
  <span class="heart" style="top:5%;  right:30%; font-size:2rem;   animation-delay:2.5s;">💞</span>

  <main class="card" id="card">
    <span class="emoji">🥺💕</span>
    <h1>Mat, will you be my girlfriend?</h1>
    <p class="subtitle">I promise lots of smiles, snacks, and adventures 💌</p>

    <div class="buttons" id="buttons">
      <button class="yes" onclick="sayYes()">Yes! 🥰</button>
      <button class="no" id="noBtn">No 🙈</button>
    </div>

    <div class="success" id="success">
      <h2>Yay!! 🎉💖</h2>
      <p>You just made me the happiest person ever! 🥹💘</p>
      <span style="font-size:2.5rem;">🌹💍✨</span>
    </div>
  </main>

<script>
  const noBtn = document.getElementById('noBtn');
  const buttons = document.getElementById('buttons');
  const success = document.getElementById('success');
  const card = document.getElementById('card');

  // Make the "No" button playfully move away when hovered/tapped
  function dodge() {
    const x = Math.random() * 160 - 80;
    const y = Math.random() * 100 - 50;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  }
  noBtn.addEventListener('mouseover', dodge);
  noBtn.addEventListener('click', (e) => { e.preventDefault(); dodge(); });

  function sayYes() {
    buttons.style.display = 'none';
    success.style.display = 'flex';
    spawnHearts();
  }

  // Burst of hearts on "Yes"
  function spawnHearts() {
    for (let i = 0; i < 25; i++) {
      const h = document.createElement('span');
      h.textContent = ['💖','💕','💗','🌸','✨','💞'][Math.floor(Math.random()*6)];
      h.style.position = 'fixed';
      h.style.left = Math.random() * 100 + 'vw';
      h.style.top = '100vh';
      h.style.fontSize = (1 + Math.random() * 2) + 'rem';
      h.style.pointerEvents = 'none';
      h.style.transition = 'transform 3s ease-out, opacity 3s';
      h.style.zIndex = 1;
      document.body.appendChild(h);
      requestAnimationFrame(() => {
        h.style.transform = `translateY(-${window.innerHeight + 100}px) rotate(${Math.random()*360}deg)`;
        h.style.opacity = 0;
      });
      setTimeout(() => h.remove(), 3200);
    }
  }
</script>

</body>
</html>
